name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack before setting up Node
        run: corepack enable
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install
      - name: Build Docs
        run: yarn docs:build
